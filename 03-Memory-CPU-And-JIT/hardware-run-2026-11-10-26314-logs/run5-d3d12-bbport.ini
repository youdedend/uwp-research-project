# bbport settings (in-game menu: Insert / L3+R3)
upscaler=off
preset=1
sharpen=1
sharpness=0.30
jitter=1
reactive=0
object_motion=0
reactive_scale=1.00
reactive_threshold=0.20
reactive_max=0.90
debug_view=0
show_fps=1
fsr4_auto_exposure=1
fsr4_invert_jitter=0
bloom=0
fsr411_backend=vk
object_motion_cache=0
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=0
effect_dynamic_shadows=0
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
cheat_no_death=0
cheat_stealth=0
cheat_silent=0
cheat_rally_no_decay=0
cheat_enemy_control=0
tweak_no_rally=0
tweak_camera_distance=0
tweak_no_camera_rotation=0
tweak_easy_run=0
tweak_ragdoll=0
tweak_circle_confirm=0
quit_to_desktop=1
rebirth=1
frame_gen=off
frame_gen_multiplier=2
frame_gen_fit_display=0
model_lod=0
output_res=1280x720
mute_unfocused=0
button_prompts=xbox
hud_position=100
fov=43
live_resolution=0
scene_res=1280x720
vsync=1
fps_cap=60
gamma=1.00
fps_patch=60
[dump]
# Empty patch_path auto-detects the update folder next to the game folder.
patch_path=
use_patch=1

# BUILD 3: the recovery watchdog. It checks once a second and acts when the app is
# within these distances of its memory limit; 0 disables every step. The stall times
# are what turns 'presents stopped' into a resolution drop, and then a clean exit.
watchdog=1
watchdog_ladder_mb=400
watchdog_pager_mb=250
watchdog_degrade_mb=150
watchdog_stuck_s=3
watchdog_exit_s=10
watchdog_cooldown_ms=2000
# heavy_features_optin=1 keeps an optional feature that costs more than 50 MiB.
heavy_features_optin=0
settings_rev=4

# Graphics-driver switches, passed to the Mesa Dozen translator (empty = off).
# dzn_debug=d3d12 turns on the D3D12 debug layer: it reports the invalid call
# before a crash instead of after it. Add nobindless/no16bit/nostencilref to hide
# device capabilities the console driver may not support. Any name in CAPITALS
# (DZN_DEBUG=..., VK_LOADER_DRIVERS_DISABLE=...) is passed through too.
dzn_debug=d3d12
